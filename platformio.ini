[platformio]
src_dir = .
include_dir = .
default_envs =
    waveshare_7inch_800x480
    devkit_spi_28inch_320x240
    devkit_spi_24inch_ili9341_pcm5102

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 16MB
board_build.flash_mode = dio
board_build.partitions = default_16MB.csv
build_src_filter = +<main.cpp>

board_build.arduino.memory_type = qio_opi
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L

build_unflags =
    -std=gnu++11
    -DARDUINO_USB_MODE=1

build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -O3
    -ffast-math
    -fsingle-precision-constant

lib_deps =
    lovyan03/LovyanGFX@1.2.36
    bblanchon/ArduinoJson@^7.0.4

; Target 1: Waveshare ESP32-S3 7" 800x480 RGB Touch LCD (with Visual Piano)
[env:waveshare_7inch_800x480]
platform = ${env.platform}
board = ${env.board}
framework = ${env.framework}
build_flags =
    ${env.build_flags}
    -DSCREEN_PROFILE=0

; Target 2: ESP32-S3-DevKitC-1 N16R8 + PCM5102A I2S + 2.8" 320x240 SPI Touch (No Visual Piano)
[env:devkit_spi_28inch_320x240]
platform = ${env.platform}
board = ${env.board}
framework = ${env.framework}
build_flags =
    ${env.build_flags}
    -DSCREEN_PROFILE=1
    -DUSE_ST7789=0

; Target 3: ESP32-S3-DevKitC-1 N16R8 (44-Pin CP2102) + 2.4" 240x320 SPI ILI9341 Touch + GY-PCM5102 I2S DAC
[env:devkit_spi_24inch_ili9341_pcm5102]
platform = ${env.platform}
board = ${env.board}
framework = ${env.framework}
build_flags =
    ${env.build_flags}
    -DSCREEN_PROFILE=1
    -DUSE_ST7789=0
    -DTFT_SPI_MOSI=11
    -DTFT_SPI_MISO=13
    -DTFT_SPI_SCLK=12
    -DTFT_SPI_CS=10
    -DTFT_SPI_DC=4
    -DTFT_SPI_RST=5
    -DTFT_SPI_BL=46
    -DTOUCH_SPI_CS=14
    -DTOUCH_SPI_IRQ=21
    -DI2S_BCLK_PIN=6
    -DI2S_DOUT_PIN=15
    -DI2S_LRCK_PIN=16
    -DI2C_SDA_PIN=8
    -DI2C_SCL_PIN=9
