[platformio]
src_dir = .
include_dir = .

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 16MB
board_build.flash_mode = dio
board_build.partitions = default_16MB.csv
build_src_filter = +<main.cpp>

board_build.arduino.memory_type = qio_opi
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L

build_unflags =
    -std=gnu++11
    -DARDUINO_USB_MODE=1

build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -O3
    -ffast-math
    -fsingle-precision-constant

lib_deps =
    lovyan03/LovyanGFX@1.2.36
    bblanchon/ArduinoJson@^7.0.4

; Target 1: Waveshare ESP32-S3 7" 800x480 RGB Touch LCD (with Visual Piano)
[env:waveshare_7inch_800x480]
build_flags =
    ${env.build_flags}
    -DSCREEN_PROFILE=0

; Target 2: ESP32-S3-DevKitC-1 N16R8 + PCM5102A I2S + 2.8" 320x240 SPI Touch (No Visual Piano)
; Change -DUSE_ST7789=0 to -DUSE_ST7789=1 if using an ST7789 panel instead of ILI9341
[env:devkit_spi_28inch_320x240]
build_flags =
    ${env.build_flags}
    -DSCREEN_PROFILE=1
    -DUSE_ST7789=0
