name: PlatformIO CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    - name: Compile ESP32-S3 Firmware
      run: pio run

    - name: Upload Compiled Firmware Binaries
      uses: actions/upload-artifact@v4
      with:
        name: esp32s3-firmware
        path: |
          .pio/build/waveshare_esp32s3_touch_lcd_7/firmware.bin
          .pio/build/waveshare_esp32s3_touch_lcd_7/partitions.bin
          .pio/build/waveshare_esp32s3_touch_lcd_7/bootloader.bin
        retention-days: 7
